name: CI

# The whole build is Python 3 plus two tools out of the `vice` package (petcat
# tokenises the BASIC, c1541 writes the .d64s).  No pip dependencies at all, so
# there is nothing to pin and nothing to cache.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"        # Sundays: the deep playtest, which is too slow for a push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (14 static checks + the players)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install VICE (petcat + c1541)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends vice
          petcat -h >/dev/null 2>&1 || true
          c1541 -h >/dev/null 2>&1 || true
      - name: verify
        run: python3 build/verify.py

      # verify.py rebuilds every artefact from source.  If that changed a tracked
      # file, the committed .bas/.d64/.PRG are stale with respect to the spec --
      # which is exactly the mistake that is invisible in review, because the
      # diff of a .d64 is unreadable.
      - name: the committed artefacts are the ones this source builds
        run: |
          if ! git diff --quiet --exit-code; then
            echo "::error::the tracked build artefacts do not match a fresh build."
            echo "Run 'python3 build/verify.py' locally and commit the result."
            git diff --stat
            exit 1
          fi

  playtest-deep:
    name: deep playtest (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Depth 3 fires all 82 rules (47 467 states, ~135 s) and the monkey runs
      # 5 000 sessions.  Too slow to sit on every push, cheap once a week.
      - name: play it properly
        run: python3 build/playtest.py --deep

  emulator:
    name: run it on a real emulated C64/C128
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install VICE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends vice xvfb

      # Debian and Ubuntu ship VICE without the Commodore ROMs -- they are
      # copyrighted, so this repository neither carries them nor fetches them
      # from anywhere.  Supply them yourself and this job becomes a real run on
      # an emulated machine; supply nothing and it says so and passes, rather
      # than pretending the game was tested on hardware it never touched.
      #
      # Set EITHER repository secret (see README, "Running it on real ROMs"):
      #   VICE_ROMS_URL  a URL to a .tar.gz -- private release asset, presigned
      #                  S3 link, anything curl can fetch
      #   VICE_ROMS_B64  the same .tar.gz, base64 -d ready, pasted straight in;
      #                  simplest, but a GitHub secret caps at 48 KB
      #
      # The archive must hold the files VICE looks for, by these exact names:
      #   C64/kernal-901227-03.bin
      #   C64/basic-901226-01.bin
      #   C64/chargen-901225-01.bin
      #   DRIVES/dos1541-325302-01+901229-05.bin
      - name: install ROMs, if this repository has been given any
        env:
          VICE_ROMS_URL: ${{ secrets.VICE_ROMS_URL }}
          VICE_ROMS_B64: ${{ secrets.VICE_ROMS_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${VICE_ROMS_URL:-}" ]; then
            curl -fsSL "$VICE_ROMS_URL" -o /tmp/roms.tar.gz
          elif [ -n "${VICE_ROMS_B64:-}" ]; then
            printf '%s' "$VICE_ROMS_B64" | base64 -d > /tmp/roms.tar.gz
          else
            echo "::notice::neither VICE_ROMS_URL nor VICE_ROMS_B64 is set -- skipping the emulator run."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # /usr/share/vice is VICE's compiled-in data directory on Debian and
          # Ubuntu -- the same place default.vrs already lives -- so dropping the
          # ROMs in beside it needs no resource fiddling.
          sudo tar -xzf /tmp/roms.tar.gz -C /usr/share/vice
          missing=0
          for f in C64/kernal-901227-03.bin C64/basic-901226-01.bin \
                   C64/chargen-901225-01.bin "DRIVES/dos1541-325302-01+901229-05.bin"; do
            if [ ! -s "/usr/share/vice/$f" ]; then
              echo "::error::the archive is missing $f"; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "SKIP=0" >> "$GITHUB_ENV"

      - name: play the critical path on an emulated C64
        if: env.SKIP == '0'
        run: python3 build/fullcycle.py elcid.d64 6510
